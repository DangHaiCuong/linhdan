<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mèo Phi Hành Gia Trong Vũ Trụ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        /* Nền vũ trụ */
        .space {
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #0a0e27 0%, #1a1a3e 50%, #0f0c29 100%);
            overflow: hidden;
        }

        /* Animation các ngôi sao */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Shooting stars */
        .shooting-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
            animation: shoot 3s linear infinite;
        }

        @keyframes shoot {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateX(-300px) translateY(300px);
                opacity: 0;
            }
        }

        /* Container mèo phi hành gia */
        .astronaut-cat-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(-50%, -50%) translateY(0px) rotate(-5deg);
            }
            50% {
                transform: translate(-50%, -50%) translateY(-30px) rotate(5deg);
            }
        }

        /* Mèo phi hành gia */
        .astronaut-cat {
            position: relative;
            width: 200px;
            height: 200px;
        }

        /* Bong bóng không gian (mũ phi hành gia) */
        .helmet {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.1));
            border-radius: 50%;
            border: 3px solid rgba(200, 230, 255, 0.5);
            box-shadow:
                inset 0 0 30px rgba(255, 255, 255, 0.2),
                0 0 30px rgba(100, 200, 255, 0.3);
            z-index: 10;
            animation: helmetGlow 2s ease-in-out infinite;
        }

        @keyframes helmetGlow {
            0%, 100% { box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.2), 0 0 30px rgba(100, 200, 255, 0.3); }
            50% { box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.3), 0 0 40px rgba(100, 200, 255, 0.5); }
        }

        /* Viền mũ */
        .helmet-ring {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 40px;
            background: linear-gradient(to bottom, #e8e8e8, #b0b0b0);
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Đầu mèo */
        .cat-head {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #ffa500 0%, #ff8c00 100%);
            border-radius: 50%;
            z-index: 8;
        }

        /* Tai mèo */
        .ear {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 40px solid #ffa500;
            z-index: 7;
        }

        .ear.left {
            top: 45px;
            left: 20px;
            transform: rotate(-30deg);
        }

        .ear.right {
            top: 45px;
            right: 20px;
            transform: rotate(30deg);
        }

        /* Mắt mèo */
        .eyes {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            display: flex;
            justify-content: space-between;
            z-index: 9;
        }

        .eye {
            width: 20px;
            height: 25px;
            background: #000;
            border-radius: 50%;
            position: relative;
            animation: blink 4s infinite;
        }

        @keyframes blink {
            0%, 48%, 52%, 100% { height: 25px; }
            50% { height: 3px; }
        }

        .eye::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
        }

        /* Mũi mèo */
        .nose {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #ff6b6b;
            z-index: 9;
        }

        /* Bộ đồ phi hành gia */
        .space-suit {
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 100px;
            background: linear-gradient(135deg, #f0f0f0 0%, #d0d0d0 100%);
            border-radius: 40px 40px 50px 50px;
            z-index: 6;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        /* Logo trên bộ đồ */
        .suit-logo {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: #4a90e2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        /* Chân mèo */
        .legs {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            display: flex;
            justify-content: space-around;
            z-index: 5;
        }

        .leg {
            width: 20px;
            height: 40px;
            background: linear-gradient(to bottom, #ffa500, #ff8c00);
            border-radius: 10px;
            animation: legSwing 3s ease-in-out infinite;
        }

        .leg:nth-child(2) {
            animation-delay: 1.5s;
        }

        @keyframes legSwing {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        /* Hành tinh */
        .planet {
            position: absolute;
            border-radius: 50%;
            animation: rotatePlanet 30s linear infinite;
        }

        .planet1 {
            top: 15%;
            left: 10%;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%);
            box-shadow: 0 0 40px rgba(255, 107, 157, 0.4);
        }

        .planet2 {
            bottom: 20%;
            right: 15%;
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 0 50px rgba(79, 172, 254, 0.4);
        }

        @keyframes rotatePlanet {
            0% { transform: rotate(0deg) translateX(20px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(20px) rotate(-360deg); }
        }

        /* Vòng hành tinh */
        .planet2::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        /* Particles */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: floatParticle 10s linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="space">
        <!-- Các ngôi sao -->
        <div class="stars" id="starsContainer"></div>

        <!-- Shooting stars -->
        <div class="shooting-star" style="top: 20%; left: 80%; animation-delay: 0s;"></div>
        <div class="shooting-star" style="top: 40%; left: 90%; animation-delay: 2s;"></div>
        <div class="shooting-star" style="top: 60%; left: 85%; animation-delay: 4s;"></div>

        <!-- Hành tinh -->
        <div class="planet planet1"></div>
        <div class="planet planet2"></div>

        <!-- Mèo phi hành gia -->
        <div class="astronaut-cat-container">
            <div class="astronaut-cat">
                <!-- Tai -->
                <div class="ear left"></div>
                <div class="ear right"></div>

                <!-- Mũ phi hành gia -->
                <div class="helmet"></div>
                <div class="helmet-ring"></div>

                <!-- Đầu -->
                <div class="cat-head"></div>

                <!-- Mắt -->
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>

                <!-- Mũi -->
                <div class="nose"></div>

                <!-- Bộ đồ -->
                <div class="space-suit">
                    <div class="suit-logo">🐱</div>
                </div>

                <!-- Chân -->
                <div class="legs">
                    <div class="leg"></div>
                    <div class="leg"></div>
                </div>
            </div>
        </div>

        <!-- Particles -->
        <div id="particlesContainer"></div>
    </div>

    <script>
        // Tạo ngôi sao ngẫu nhiên
        function createStars() {
            const starsContainer = document.getElementById('starsContainer');
            const numberOfStars = 200;

            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                const size = Math.random() * 3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';

                starsContainer.appendChild(star);
            }
        }

        // Tạo particles
        function createParticles() {
            const particlesContainer = document.getElementById('particlesContainer');
            const numberOfParticles = 30;

            for (let i = 0; i < numberOfParticles; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                const size = Math.random() * 4 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = '0';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';

                particlesContainer.appendChild(particle);
            }
        }

        // Khởi tạo khi trang load
        window.addEventListener('load', () => {
            createStars();
            createParticles();
        });

        // Hiệu ứng di chuyển mèo theo chuột (tùy chọn)
        document.addEventListener('mousemove', (e) => {
            const cat = document.querySelector('.astronaut-cat-container');
            const x = (e.clientX / window.innerWidth - 0.5) * 50;
            const y = (e.clientY / window.innerHeight - 0.5) * 50;

            cat.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        });
    </script>
</body>
</html>
